services:
  tavern-backend:
    container_name: tavern-backend
    restart: unless-stopped
    image: tavern-backend # Give the image a better name, real image is generated from the dockerfile below
    build:
      context: .
      dockerfile: Backend/Dockerfile
      args:
        - HostUrl=${HostUrl}
        - KeycloakUrl=${KeycloakUrl}
        - KeycloakRealm=${KeycloakRealm}
    ports:
      - "${BackendPort:-8080}:8080"
    env_file:
      - .env
      - .env.runtime
    environment:
      - PostgresqlConnectionString=${PostgresConnectionString}
      - ASPNETCORE_ENVIRONMENT=Production

  tavern-frontend:
    container_name: tavern-frontend
    restart: unless-stopped
    image: tavern-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - KeycloakUrl=${KeycloakUrl}
        - KeycloakRealm=${KeycloakRealm}
        - KeycloakClientId=${KeycloakClientId}
        - HostUrl=${HostUrl}
        - ApiUrl=${ApiUrl}
        - LOGO_URL=${LOGO_URL}
        - BOARD_PRIMARY_LIGHT=${BOARD_PRIMARY_LIGHT}
        - BOARD_PRIMARY=${BOARD_PRIMARY}
        - BOARD_PRIMARY_DARK=${BOARD_PRIMARY_DARK}
    ports:
      - "${FrontendPort:-5173}:3000"
    env_file:
      - .env
      - .env.runtime

volumes:
  postgres-data:
