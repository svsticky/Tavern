services:
  tavern-backend:
    container_name: tavern-backend
    restart: unless-stopped
    image: tavern-backend # Give the image a better name, real image is generated from the dockerfile below
    build:
      context: .
      dockerfile: Backend/Dockerfile
    ports:
      - "${BackendPort:-8080}:8080"
    env_file:
      - .env
    environment:
      - PostgresqlConnectionString=${PostgresqlConnectionString}
      - ASPNETCORE_ENVIRONMENT=Production

  tavern-frontend:
    container_name: tavern-frontend
    restart: unless-stopped
    image: tavern-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "${FrontendPort:-5173}:3000"
    environment:
      - VITE_KeycloakUrl=${KeycloakUrl}
      - VITE_KeycloakRealm=${KeycloakRealm}
      - VITE_KeycloakClientId=${KeycloakClientId}
      - VITE_HostUrl=${HostUrl}
      - VITE_ApiUrl=${ApiUrl}
      - VITE_LOGO_URL=${LOGO_URL}
      - VITE_BOARD_PRIMARY_LIGHT=${BOARD_PRIMARY_LIGHT}
      - VITE_BOARD_PRIMARY=${BOARD_PRIMARY}
      - VITE_BOARD_PRIMARY_DARK=${BOARD_PRIMARY_DARK}

  tavern-docs:
    build:
      context: .
      dockerfile: Docs/Dockerfile
      target: production # Use production target
    ports:
      - "${DocsPort:-3001}:3001"
    environment:
      - NODE_ENV=production
      - ApiUrl=${ApiUrl:-http://localhost:8080}
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"