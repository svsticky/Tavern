services:
  tavern-backend:
    container_name: tavern-backend
    restart: unless-stopped
    image: tavern-backend # Give the image a better name, real image is generated from the dockerfile below
    build:
      context: .
      dockerfile: Backend/Dockerfile
    ports:
      - "8080:8080"

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # TODO move this to docker secrets or something
      POSTGRES_DB: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data/
#    ports:
#      - "5432:5432"

  tavern-frontend:
    container_name: tavern-frontend
    restart: unless-stopped
    image: tavern-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:5173"

volumes:
  postgres-data:
