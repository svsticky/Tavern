version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/Backend", "/Backend.Tests"]
    target-branch: development
    commit-message:
      prefix: "Chore"
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/Frontend", "/Docs"]
    target-branch: development
    commit-message:
      prefix: "Chore"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: development
    commit-message:
      prefix: "Chore"
    schedule:
      interval: weekly
