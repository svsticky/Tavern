services:
  devcontainer:
    container_name: tavern-devcontainer
    image: tavern-devcontainer
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity
    env_file:
      - .env
    networks:
      - tavern-net
    depends_on:
      - db
      - localstack

  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - tavern-net

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - PERSISTENCE=1
      - DATA_DIR=/var/lib/localstack/state
      - LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT=1
    volumes:
      - ./localstack-setup:/etc/localstack/init/ready.d
      - ./localstack-data:/var/lib/localstack/state
    networks:
      - tavern-net

volumes:
  postgres-data:
  localstack-data:

networks:
  tavern-net:
    driver: bridge