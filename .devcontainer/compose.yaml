services:
  devcontainer:
    container_name: tavern-devcontainer
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity
    environment:
      - PostgresqlConnectionString=Host=db;Port=5432;Database=postgres;Username=postgres;Password=postgres
    env_file:
      - ../.env
      - ../.env.runtime
    networks:
      - tavern-net
    depends_on:
      - db
      - localstack

  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - tavern-net

  localstack:
    image: localstack/localstack:3.0
    container_name: tavern-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
    volumes:
      - ./localstack-setup/:/etc/localstack/init/ready.d/
    networks:
      - tavern-net

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "devcontainer:8080" 
    ports:
      - "4040:4040" 
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    networks:
      - tavern-net
    depends_on:
      - devcontainer

volumes:
  postgres-data:

networks:
  tavern-net:
    driver: bridge