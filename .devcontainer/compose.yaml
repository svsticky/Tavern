services:
  devcontainer:
    container_name: tavern-devcontainer
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity
    env_file:
      - ../.env
      - ./devcontainer.env
    networks:
      - tavern-net
    depends_on:
      - db
      - localstack
      - keycloak
      - redis

  redis:
    image: redis:7-alpine
    container_name: tavern-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tavern-net

  db:
    image: postgres:17
    container_name: tavern-db
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tavern-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: tavern-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - tavern-net

  localstack:
    image: localstack/localstack:3.0
    container_name: tavern-localstack
    restart: unless-stopped
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=s3
    volumes:
      - ./localstack-setup/:/etc/localstack/init/ready.d/
    networks:
      - tavern-net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: tavern-ngrok
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$NGROK_AUTHTOKEN" ]; then
          echo "NGROK_AUTHTOKEN is not set. ngrok will not be started."
          sleep infinity
        else
          exec ngrok http devcontainer:8080
        fi
    ports:
      - "127.0.0.1:4040:4040" 
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    networks:
      - tavern-net
    depends_on:
      - devcontainer

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: tavern-keycloak
    restart: unless-stopped
    command: start-dev --import-realm --features=preview
    env_file:
      - ./devcontainer.env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      webhookUrl: "http://devcontainer:8080/members/webhook/refresh-email"
      webhookSecret: kdfsjf*DFf9A
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    volumes:
      - ./keycloak-setup:/opt/keycloak/data/import
      - ./keycloak-themes:/opt/keycloak/themes
      - ./keycloak-plugins:/opt/keycloak/providers
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - tavern-net
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  postgres-data:

networks:
  tavern-net:
    driver: bridge
