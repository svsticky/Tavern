# Execute Actions - Welcome (getoond wanneer e-mailverificatie is vereist, d.w.z. een nieuw lid)
welcomeTitle=Welkom bij Sticky!
welcomeIntro=Je ontvangt deze mail omdat je je hebt aangemeld voor onze machtig mooie studievereniging! Onderaan deze mail vind je de knop om je account in ons ledenportaal te activeren.
welcomeAbout=Bij Sticky kun je terecht voor alles wat jij als student Informatica, Informatiekunde of Gametechnologie nodig hebt! Je kunt altijd een gratis kop koffie en een koekje scoren in onze kamer (BBG 2.81), of een ander(e) drankje/snack. In de kamer is ook altijd iemand van het bestuur aanwezig om al jouw vragen te beantwoorden.
welcomeCommunity=Naast deze plek om te chillen tijdens pauzes of tussen de colleges door, organiseren we ook nog eens enorm veel activiteiten! Deze zijn altijd in lijn met één van de drie pijlers van Sticky: onderwijs, bedrijfsleven en gezelligheid. Word ook lid van de <a href="https://www.facebook.com/groups/814759978565158" style="color: #fa6b20;">Sticky-leden Facebookgroep</a> en like <a href="https://www.facebook.com/stickyutrecht" style="color: #fa6b20;">onze pagina</a>! Je kan ook een WhatsApp-berichtje sturen naar de Sticky Phone (+31617695025) met "Hoi + [je naam]" voor automatische updates over activiteiten.
welcomeEducationTitle=Onderwijs
welcomeEducationBody=Wij organiseren hulpmiddagen, workshops en informatiebijeenkomsten om jou te ondersteunen bij je studie. Ook is de Commissaris Onderwijs jouw aanspreekpunt voor alles wat met het onderwijs en de kwaliteit daarvan te maken heeft.
welcomeCareerTitle=Bedrijfsleven
welcomeCareerBody=Om jou een zo goed mogelijk beeld te geven van de bedrijven waar jij later aan de slag kunt, organiseren wij lezingen, workshops, inhousedagen en borrels in samenwerking met deze bedrijven.
welcomeSocialTitle=Gezelligheid
welcomeSocialBody=Naast alle studie- en carrièregerelateerde activiteiten, organiseren we ook veel simpelweg gezellige activiteiten. Daarnaast is er wekelijks een gratis borrel!
welcomeNextTitle=En nu?
welcomeNextBody=Nieuwsgierig naar welke activiteiten we binnenkort organiseren? Meer informatie vind je in ons ledenportaal, en je kunt je daar ook meteen inschrijven. Om toegang te krijgen, moet je nog het volgende doen:

