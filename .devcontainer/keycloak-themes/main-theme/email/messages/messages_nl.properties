# Execute Actions - Welcome (getoond wanneer e-mailverificatie is vereist, d.w.z. een nieuw lid)
# Tekst overgenomen uit de oude Koala (svsticky/constipated-koala), config/locales/mailings.nl.yml
welcomeTitle=Welkom bij Sticky!
welcomeIntro=Je ontvangt deze mail omdat je je hebt aangemeld voor onze machtig mooie studievereniging! Aan het eind van deze mail vind je de knop om je account in ons ledenportaal te activeren. Je kunt ook dit prachtige introductiepraatje overslaan en meteen naar beneden scrollen, dat zien we toch niet (of toch wel?).
welcomeAbout=Bij Sticky kun je terecht voor alles wat jij als student Informatica, Informatiekunde of Gametechnologie nodig hebt! Zoals je wellicht al vernomen hebt, kun je altijd een gratis kop koffie en een koekje scoren in onze kamer (BBG 2.81), of een ander(e) drankje/snack. In de kamer is ook altijd iemand van het bestuur aanwezig om al jouw vragen te beantwoorden. Naast deze plek om te chillen tijdens pauzes of tussen de colleges door, organiseren we ook nog eens enorm veel woestgave activiteiten! Deze activiteiten zijn altijd in lijn met één van de drie pijlers van Sticky: onderwijs, bedrijfsleven en gezelligheid.
welcomeCommunity=Altijd op de hoogte blijven van deze activiteiten? Volg ons op <a href="https://www.instagram.com/stickyutrecht/" style="color: #fa6b20;">Instagram</a> en op <a href="https://www.linkedin.com/company/studievereniging-sticky" style="color: #fa6b20;">LinkedIn</a>! Daarnaast vind je alle informatie die je ooit had kunnen wensen op onze website: <a href="https://svsticky.nl" style="color: #fa6b20;">svsticky.nl</a>. Je kunt ook lid worden van onze <a href="https://svsticky.nl/promokanaal" style="color: #fa6b20;">WhatsApp community</a> om altijd op de hoogte gehouden te worden van aankomende activiteiten!
welcomeEducationTitle=Onderwijs
welcomeEducationBody=Wij organiseren hulpmiddagen, workshops en informatiebijeenkomsten om jou te ondersteunen bij je studie. Ook is de Commissaris Onderwijs jouw aanspreekpunt voor alles wat met het onderwijs en de kwaliteit daarvan te maken heeft. Bij ons kun je je studieboeken gemakkelijk kopen en thuis later bezorgen via <a href="https://svsticky.nl/boeken" style="color: #fa6b20;">svsticky.nl/boeken</a>!
welcomeCareerTitle=Bedrijfsleven
welcomeCareerBody=Om jou een zo goed mogelijk beeld te geven van al die verschillende bedrijven waar jij later aan de slag kunt, organiseren wij in samenwerking met deze bedrijven verschillende lezingen, workshops, inhousedagen en borrels. Deze activiteiten bieden naast informatie over het bedrijf in kwestie, ook nog eens een mooie gelegenheid om eens iets extra’s/compleet nieuws te leren. Op zoek naar een studiegerelateerde (bij)baan? Deze vind je via <a href="https://svsticky.nl/carriere/vacatures" style="color: #fa6b20;">svsticky.nl/carriere/vacatures</a>.
welcomeSocialTitle=Gezelligheid
welcomeSocialBody=Naast alle bovenstaande studie- en carrièregerelateerde activiteiten, organiseren we ook veel simpelweg gezellige activiteiten. Daarnaast is er wekelijks een gratis borrel!
welcomeNextTitle=En nu?
welcomeNextBody=Nieuwsgierig naar welke activiteiten we binnenkort organiseren? Meer informatie vind je in ons ledenportaal, <a href="https://koala.svsticky.nl" style="color: #fa6b20;">Koala</a>, en je kunt je daar ook meteen inschrijven! Daarnaast kun je in dit ledenportaal ook je gegevens aanpassen.
welcomeActivateInstructions=Activeer je account door op onderstaande knop te klikken. Deze link is {0} minuten geldig.

