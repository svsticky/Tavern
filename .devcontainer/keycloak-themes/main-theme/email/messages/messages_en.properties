# Execute Actions - Welcome (shown when email verification is required, i.e. a new member)
welcomeTitle=Welcome to Sticky!
welcomeIntro=You're receiving this email because you signed up for our wonderful study association! At the bottom of this email you'll find the button to activate your account on our member portal.
welcomeAbout=At Sticky you can go for everything you need as an Computer Science, Information Science or Game Technology student! You can always grab a free cup of coffee and a cookie in our room (BBG 2.81), or another drink/snack. There's always a board member around in the room to answer any questions you might have.
welcomeCommunity=Besides this place to hang out during breaks or between lectures, we also organize a huge number of great activities! These always tie into one of Sticky's three pillars: education, career and social. Join the <a href="https://www.facebook.com/groups/814759978565158" style="color: #fa6b20;">Sticky members Facebook group</a> and like <a href="https://www.facebook.com/stickyutrecht" style="color: #fa6b20;">our page</a>! You can also send a WhatsApp message to the Sticky Phone (+31617695025) saying "Hi + [your name]" for automatic updates about activities.
welcomeEducationTitle=Education
welcomeEducationBody=We organize help sessions, workshops and information sessions to support you with your studies. The Education Officer is also your point of contact for anything related to education and its quality.
welcomeCareerTitle=Career
welcomeCareerBody=To give you the best possible picture of the companies you could work at later, we organize talks, workshops, in-house days and drinks together with these companies.
welcomeSocialTitle=Social
welcomeSocialBody=Besides all the study- and career-related activities, we also organize plenty of purely social activities. There's also a free drink every week!
welcomeNextTitle=What's next?
welcomeNextBody=Curious which activities we're organizing soon? You'll find more information in our member portal, where you can also enroll right away. To gain access, you still need to do the following:

# Email Verification
emailVerificationTitle=Verify your email
emailVerificationBody=Thanks for joining Sticky! To complete your registration, we need to verify that this email address is correct.
emailVerificationWarning=This verification link is valid for {0} minutes. If you did not request this, you can safely ignore this email.

