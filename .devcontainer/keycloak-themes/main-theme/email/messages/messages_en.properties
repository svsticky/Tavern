# Execute Actions - Welcome (shown when email verification is required, i.e. a new member)
# Text taken from the old Koala (svsticky/constipated-koala), config/locales/mailings.en.yml
welcomeTitle=Welcome to Sticky!
welcomeIntro=You are receiving this e-mail, because you signed up for our mighty beautiful study association! At the end of this mail you will find a button to activate your account in our members portal. You could also skip this gorgeous introduction talk and scroll down immediately. We won't see that anyway (or will we?).
welcomeAbout=You can go to Sticky for everything that you as Computer Science, Information Science or Game technology need! As you might have noticed already, you can always score free coffee and a cookie in our room (BBG 2,81) or some other drink/snack. There will always be someone of the board present in the room who can answer all your questions. Besides this place to chill during breaks or in between lectures, we also organise a whole lot of wildly awesome activities. These activities are always aligned to one of the three corner stones of Sticky: Education, Business and Sociability.
welcomeCommunity=Do you always want to stay informed about these activities? Follow us on <a href="https://www.instagram.com/stickyutrecht/" style="color: #fa6b20;">the Sticky-members Instagram</a> and on <a href="https://www.linkedin.com/company/studievereniging-sticky" style="color: #fa6b20;">LinkedIn</a>! Aside from that, you can find all information that you could ever want on our website: <a href="https://svsticky.nl" style="color: #fa6b20;">svsticky.nl</a>. You can also join our <a href="https://svsticky.nl/promochannel" style="color: #fa6b20;">WhatsApp promotion channel</a> to be notified about upcoming activities!
welcomeEducationTitle=Education
welcomeEducationBody=We organise helper days, workshops and information meetings to support you with your study. The Commissioner for Education is your point of contact for anything to do with education and it's quality. You can conveniently buy the books you need and have them delivered at your home at <a href="https://svsticky.nl/boeken" style="color: #fa6b20;">svsticky.nl/boeken</a>!
welcomeCareerTitle=Business
welcomeCareerBody=To give you the best possible picture of the different companies you could start working for in the future, we organise varying lectures, workshops, in-house days and drinks with these companies. These activities offer besides information about the company in question, also a nice opportunity to learn something extra or something completely new. Are you looking for a study-related job? You can find these at <a href="https://svsticky.nl/carriere/vacatures" style="color: #fa6b20;">svsticky.nl/carriere/vacatures</a>.
welcomeSocialTitle=Sociability
welcomeSocialBody=Besides the study- and carrier-related activities stated above, we also organise many simply sociable activities, like the weekly drinks!
welcomeNextTitle=And now?
welcomeNextBody=Curious about which activities we will soon organize? You can find more information in our member portal, <a href="https://koala.svsticky.nl" style="color: #fa6b20;">Koala</a>, and you can enroll there too! In this member portal you can also edit your profile.
welcomeActivateInstructions=Activate your account by clicking the button below. This link is valid for {0} minutes.

